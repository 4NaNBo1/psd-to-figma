name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Build with tag version
        run: npm run build
        env:
          VERSION: ${{ github.ref_name }}

      - name: Package
        run: cd dist && zip -r ../psd-to-figma-${{ github.ref_name }}.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: psd-to-figma-${{ github.ref_name }}.zip
          generate_release_notes: true
