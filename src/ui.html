<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1e1e1e;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .tab-bar {
      display: flex;
      border-bottom: 1px solid #333;
      background: #252525;
      flex-shrink: 0;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 0;
      border: none;
      background: transparent;
      color: #888;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }

    .tab-btn:hover { color: #ccc; background: #2a2a2a; }
    .tab-btn.active { color: #a78bfa; border-bottom-color: #7b61ff; }

    .tab-content {
      flex: 1;
      position: relative;
    }

    .tab-panel {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      width: auto;
      max-width: 360px;
      margin: 0 auto;
      padding: 16px;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }

    .tab-panel.active {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
    }

    .footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      text-align: center;
      font-size: 11px;
      color: #666;
      padding: 6px 48px;
      background: rgba(30, 30, 30, 0.85);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 10;
    }

    .footer a {
      color: #a78bfa;
      text-decoration: none;
      cursor: pointer;
    }

    .footer a:hover { text-decoration: underline; }

    .drop-zone {
      border: 2px dashed #555;
      border-radius: 12px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      background: #2a2a2a;
      height: 270px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .drop-zone:hover,
    .drop-zone.dragover {
      border-color: #7b61ff;
      background: #2f2a40;
    }

    .drop-zone p {
      font-size: 13px;
      color: #aaa;
      margin-top: 8px;
    }

    .drop-zone .icon {
      font-size: 36px;
      color: #7b61ff;
      margin-bottom: 8px;
    }

    .drop-zone .main-text {
      font-size: 14px;
      font-weight: 500;
      color: #ddd;
    }

    input[type="file"] { display: none; }

    .progress-area {
      margin-top: 20px;
      visibility: hidden;
    }

    .progress-area.visible { visibility: visible; }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: #333;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #7b61ff, #a78bfa);
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .progress-text {
      font-size: 12px;
      color: #aaa;
      margin-top: 8px;
      text-align: center;
      min-height: 16px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .error-area {
      margin-top: 6px;
      font-size: 12px;
      color: #f87171;
      text-align: center;
      min-height: 16px;
      visibility: hidden;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .error-area.visible { visibility: visible; }

    .copy-log-fab {
      position: fixed;
      right: 8px;
      bottom: 2px;
      z-index: 20;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid #444;
      background: rgba(42, 42, 42, 0.85);
      color: #aaa;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.15s;
    }

    .copy-log-fab:hover {
      background: rgba(55, 55, 55, 0.95);
      color: #ddd;
      border-color: #666;
    }

    .copy-log-fab.copied {
      color: #4ade80;
      border-color: #4ade80;
      transform: scale(1.1);
    }

    .copy-log-fab svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Export tab styles */
    .export-section {
      background: #2a2a2a;
      border-radius: 12px;
      padding: 20px;
      height: 270px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .selection-info {
      text-align: center;
      padding: 16px 0;
    }

    .selection-info .sel-icon {
      font-size: 32px;
      color: #7b61ff;
      margin-bottom: 8px;
    }

    .selection-info .sel-text {
      font-size: 13px;
      color: #aaa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .selection-info .sel-names {
      font-size: 12px;
      color: #888;
      margin-top: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .selection-info .sel-count {
      font-size: 14px;
      font-weight: 500;
      color: #ddd;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .filename-row {
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .filename-row label {
      font-size: 12px;
      color: #aaa;
      white-space: nowrap;
    }

    .filename-row input {
      flex: 1;
      padding: 6px 10px;
      border: 1px solid #444;
      border-radius: 6px;
      background: #1e1e1e;
      color: #e0e0e0;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    .filename-row input:focus {
      border-color: #7b61ff;
    }

    .filename-row .ext {
      font-size: 12px;
      color: #888;
    }

    .export-btn {
      margin-top: 16px;
      width: 100%;
      padding: 10px 0;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #7b61ff, #a78bfa);
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .export-btn:hover { opacity: 0.9; }
    .export-btn:active { transform: scale(0.98); }
    .export-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

  </style>
</head>
<body>
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="import">导入 PSD</button>
    <button class="tab-btn" data-tab="export">导出 PSD</button>
  </div>

  <div class="tab-content">
    <!-- Import Tab -->
    <div class="tab-panel active" id="tabImport">
      <div class="drop-zone" id="dropZone">
        <div class="icon">&#128193;</div>
        <div class="main-text">拖入 PSD 文件或点击选择</div>
        <p>支持 .psd 格式 (RGB 模式) · 可一次选/拖多个文件</p>
      </div>

      <input type="file" id="fileInput" accept=".psd" multiple>

      <div class="progress-area" id="progressArea">
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressText"></div>
      </div>

      <div class="error-area" id="errorArea"></div>
    </div>

    <!-- Export Tab -->
    <div class="tab-panel" id="tabExport">
      <div class="export-section">
        <div class="selection-info" id="selectionInfo">
          <div class="sel-icon">&#127912;</div>
          <div class="sel-text">请在画布中选中要导出的节点</div>
        </div>

        <div class="filename-row" id="filenameRow" style="display:none;">
          <label>文件名</label>
          <input type="text" id="exportFileName" placeholder="输入文件名">
          <span class="ext">.psd</span>
        </div>

        <button class="export-btn" id="exportBtn" disabled>导出 PSD</button>
      </div>

      <div class="progress-area" id="exportProgressArea">
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="exportProgressFill"></div>
        </div>
        <div class="progress-text" id="exportProgressText"></div>
      </div>

      <div class="error-area" id="exportErrorArea"></div>
    </div>
  </div>

  <div class="footer" id="footer"></div>

  <button class="copy-log-fab" id="copyLogBtn" title="复制日志">
    <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
  </button>

  <!-- SCRIPT_PLACEHOLDER -->
</body>
</html>
