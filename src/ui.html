<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1e1e1e;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 360px;
    }

    .footer {
      margin-top: 16px;
      text-align: center;
      font-size: 11px;
      color: #666;
    }

    .footer a {
      color: #a78bfa;
      text-decoration: none;
      margin-left: 6px;
    }

    .footer a:hover { text-decoration: underline; }

    .drop-zone {
      border: 2px dashed #555;
      border-radius: 12px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      background: #2a2a2a;
    }

    .drop-zone:hover,
    .drop-zone.dragover {
      border-color: #7b61ff;
      background: #2f2a40;
    }

    .drop-zone p {
      font-size: 13px;
      color: #aaa;
      margin-top: 8px;
    }

    .drop-zone .icon {
      font-size: 36px;
      color: #7b61ff;
      margin-bottom: 8px;
    }

    .drop-zone .main-text {
      font-size: 14px;
      font-weight: 500;
      color: #ddd;
    }

    input[type="file"] { display: none; }

    .progress-area {
      margin-top: 20px;
      display: none;
    }

    .progress-area.visible { display: block; }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: #333;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #7b61ff, #a78bfa);
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .progress-text {
      font-size: 12px;
      color: #aaa;
      margin-top: 8px;
      text-align: center;
      min-height: 16px;
    }

    .error-area {
      margin-top: 12px;
      padding: 10px 12px;
      background: #3a2020;
      border: 1px solid #6b3030;
      border-radius: 8px;
      font-size: 12px;
      color: #f87171;
      display: none;
    }

    .error-area.visible { display: block; }

    .copy-log-fab {
      position: fixed;
      right: 12px;
      bottom: 12px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid #444;
      background: rgba(42, 42, 42, 0.85);
      color: #aaa;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.15s;
    }

    .copy-log-fab:hover {
      background: rgba(55, 55, 55, 0.95);
      color: #ddd;
      border-color: #666;
    }

    .copy-log-fab.copied {
      color: #4ade80;
      border-color: #4ade80;
      transform: scale(1.1);
    }

    .copy-log-fab svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="drop-zone" id="dropZone">
      <div class="icon">&#128193;</div>
      <div class="main-text">拖入 PSD 文件或点击选择</div>
      <p>支持 .psd 格式 (RGB 模式)</p>
    </div>

    <input type="file" id="fileInput" accept=".psd">

    <div class="progress-area" id="progressArea">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
      <div class="progress-text" id="progressText"></div>
    </div>

    <div class="error-area" id="errorArea"></div>

    <div class="footer" id="footer"></div>
  </div>

  <button class="copy-log-fab" id="copyLogBtn" title="复制日志">
    <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
  </button>

  <!-- SCRIPT_PLACEHOLDER -->
</body>
</html>
